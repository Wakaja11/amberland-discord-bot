name: Tests

on:
  push:
  pull_request:

jobs:
  content-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run content filter tests
        run: python -m unittest -v test_content_filter.py
